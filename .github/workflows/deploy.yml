name: Deploy to live

on:
  push:
    branches: [main]
  workflow_dispatch: # allow a manual re-deploy from the Actions tab

# Never run two deploys at the same time; a newer push waits for the current one.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  check:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      # Catch a broken file before it reaches the live server.
      - name: Lint PHP files
        run: |
          find app config database routes -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  deploy:
    name: Deploy over SSH
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Fail early with a clear message instead of a confusing SSH error.
      - name: Check required secrets
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::Add the SSH_KEY secret (contents of mymee-new-key.pem)"; exit 1; }

      - uses: appleboy/ssh-action@v1
        with:
          # AWS EC2 server; override with SSH_HOST / SSH_USER secrets if it changes.
          host: ${{ secrets.SSH_HOST || '13.201.45.14' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/var/www/myme_admin' }}"

            # storage/ and bootstrap/cache/ belong to www-data (the web server),
            # so artisan runs as that user to be able to write there.
            ARTISAN="sudo -n -u www-data php artisan"

            # Prefer a global composer; fall back to the composer.phar in the repo.
            if command -v composer >/dev/null 2>&1; then COMPOSER="composer"; else COMPOSER="php composer.phar"; fi

            $ARTISAN down --retry=15 || true
            # Bring the site back up even if a later step fails.
            trap "$ARTISAN up" EXIT

            # --ff-only: refuses to deploy (instead of silently overwriting) if
            # someone edited files directly on the server.
            git pull --ff-only origin main

            # --no-scripts: the post-install script writes to bootstrap/cache,
            # so it runs separately below as www-data.
            $COMPOSER install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            $ARTISAN package:discover --ansi

            $ARTISAN migrate --force

            $ARTISAN config:cache
            # Some routes are closures; if they can't be cached, run uncached.
            $ARTISAN route:cache || $ARTISAN route:clear
            $ARTISAN view:cache

            echo "Deployed $(git rev-parse --short HEAD)"
